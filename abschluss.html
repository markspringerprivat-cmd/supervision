<body >
<header><div class="wrap"><h1>Abschluss</h1><p>Ende der Simulation</p></div></header>
<main class="wide-main">
  <section class="card highlight">
    <h2>Abschluss</h2>
    <p>Die Gruppensupervision ist abgeschlossen. Die Ergebnissicherung erfolgt über die Rolle Supervisor*in bzw. bei einer Fünferkonstellation zusätzlich über die Rolle Protokoll.</p>
  </section>
  <div class="nav-row"><a id="groupProgressBtn" class="button" href="gruppe-fortschritt.html">Zum Gruppenfortschritt</a><a class="button secondary" href="index.html">Zur Startseite</a></div>
</main>
<footer><div class="wrap">Gruppen-ID: <span data-group-id></span></div></footer>
<script src="js/config.js?v=manometer-thanks-slide-beige-v113"></script><script src="js/app.js?v=manometer-thanks-slide-beige-v113"></script>
<script src="js/roles_flow_patch.js?v=manometer-thanks-slide-beige-v113"></script>
<script src="js/editor_v6_patch.js?v=editor-v8-handoff"></script>
<script src="js/guided_flow_patch.js?v=manometer-thanks-slide-beige-v113"></script>

<script id="abschluss_progress_link_v40">
(function(){
  function groupId(){
    try{
      var p=new URLSearchParams(location.search);
      return p.get('g') || p.get('groupId') || localStorage.getItem('sv_current_group') || '';
    }catch(_){return '';}
  }
  function apply(){
    var gid=groupId();
    var btn=document.getElementById('groupProgressBtn');
    if(btn && gid) btn.href='gruppe-fortschritt.html?g='+encodeURIComponent(gid);
  }
  apply();
  document.addEventListener('DOMContentLoaded', apply);
})();
</script>
<script src="js/role_personalizer_v62.js?v=manometer-thanks-slide-beige-v113"></script>

<script id="abschluss_supervisor_moderation_v109">
(function(){
  try{
    var p=new URLSearchParams(location.search);
    if(p.get('supervisorMode')!=='moderation' && p.get('members')!=='5') return;
    localStorage.setItem('sv_supervisor_mode_active','moderation');
    document.querySelectorAll('a,button').forEach(function(el){
      var txt=(el.textContent||'').toLowerCase();
      var href=(el.getAttribute('href')||'').toLowerCase();
      if(txt.indexOf('präsentation')>=0 || txt.indexOf('zusammenfassung')>=0 || href.indexOf('zusammenfassung')>=0 || href.indexOf('praesentation')>=0){
        el.style.display='none';
        el.hidden=true;
      }
    });
  }catch(_){}
})();
</script>

</body>
</html>
