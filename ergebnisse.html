<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ergebnisse aus den Gruppen</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-mode="results">
<header>
  <div class="wrap topbar">
    <div><h1>Ergebnisse aus den Gruppen</h1><p>Zentrale Übersicht</p></div>
    <div class="header-actions">
      <button id="adminLoginBtn" class="secondary" type="button">Administrator</button>
      <button id="deleteAllBtn" class="danger admin-only" type="button" hidden>Alle Ergebnisse löschen</button>
    </div>
  </div>
</header>
<main>
  <section class="card highlight">
    <h2>Zentrale Ergebnisübersicht</h2>
    <p>Hier erscheinen die abgesendeten Gruppenergebnisse. Die Administrationsfunktionen können oben freigeschaltet werden.</p>
    <p id="resultsStatus" class="small">Ergebnisse werden geladen …</p>
  </section>
  <section class="carousel-controls card compact admin-only" id="resultsControls" hidden>
    <div class="random-area"><button id="randomGroupBtn" type="button">Zufallsauswahl starten</button><div id="roundBadges" class="round-badges" aria-label="Rundenmarkierungen"></div></div>
    <div class="carousel-nav">
      <button id="prevGroupBtn" type="button" class="secondary" aria-label="Vorherige Gruppe">←</button>
      <span id="carouselCounter" class="small">0 / 0</span>
      <button id="nextGroupBtn" type="button" class="secondary" aria-label="Nächste Gruppe">→</button>
    </div>
  </section>
  <section class="result-carousel" id="resultCarousel" aria-label="Gruppenergebnisse">
    <div id="resultsContent" class="result-track"></div>
  </section>
  <div class="nav-row"><a class="button secondary" href="index.html">Zur Startseite</a></div>
</main>
<footer><div class="wrap">Gruppen-ID: <span data-group-id></span></div></footer>
<script src="js/config.js"></script><script src="js/app.js"></script>
</body>
</html>
