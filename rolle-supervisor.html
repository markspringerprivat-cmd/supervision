<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rollenkarte Supervisor*in</title>
  <link rel="stylesheet" href="css/styles.css?v=group-presentation-v48">
</head>
<body data-mode="rolecard" data-role="supervisor">
<header><div class="wrap"><h1>Rollenkarte Supervisor*in</h1><p>Lies deine Rolle sorgfältig. Danach siehst du den passenden Ablauf für deine Rolle.</p></div></header>
<main class="wide-main">
  <div id="roleCard" class="grid"></div>
  <div class="nav-row">
    <a id="nextPrep" class="button" href="#">Weiter: Ablauf ansehen</a>
    <a id="backToRolesOverview" class="button secondary" href="rollen.html" data-keep-state>Zur Rollenverteilung</a>
  </div>
</main>
<footer><div class="wrap">Gruppen-ID: <span data-group-id></span></div></footer>
<script src="js/config.js?v=group-presentation-v48"></script><script src="js/app.js?v=group-presentation-v48"></script>
<script src="js/roles_flow_patch.js?v=group-presentation-v48"></script>
<script src="js/editor_v6_patch.js?v=editor-v8-handoff"></script>
<script src="js/guided_flow_patch.js?v=group-presentation-v48"></script>
<script src="js/group_registry_patch.js?v=group-registry-v22"></script>
<script src="js/group_session_v33.js?v=group-session-v42"></script>

<script id="rolecard_repair_v39">
(function(){
  function groupId(){
    try{
      var p=new URLSearchParams(location.search);
      return p.get('groupId')||p.get('g')||localStorage.getItem('sv_current_group')||'';
    }catch(_){return '';}
  }
  function repairLinks(){
    var gid=groupId();
    var back=document.getElementById('backToRolesOverview');
    if(back && gid) back.href='rollen.html?groupId='+encodeURIComponent(gid);
  }
  function repairRoleContent(){
    var target=document.getElementById('roleCard');
    if(target && !target.innerHTML.trim()){
      try{ if(typeof window.initRoleCard==='function') window.initRoleCard(); }catch(_){}
      try{ if(!target.innerHTML.trim() && typeof initRoleCard==='function') initRoleCard(); }catch(_){}
    }
  }
  repairLinks();
  setTimeout(repairLinks,100);
  setTimeout(repairRoleContent,100);
  setTimeout(repairRoleContent,500);
})();
</script>
</body>
</html>
