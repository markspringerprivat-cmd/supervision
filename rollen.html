<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rollenverteilung</title>
  <link rel="stylesheet" href="css/styles.css?v=compact-protocol-v4">
</head>
<body data-mode="roles">
<header><div class="wrap"><h1>Rollenverteilung</h1><p>Gruppe bilden und Rollen zufällig zuweisen</p></div></header>
<main class="wide-main roles-page">
  <section class="card roles-assignment-card">
    <h2>Namen eintragen</h2>
    <p class="small">Mindestens 4 Namen. Bei 5 Personen wird die fünfte Person als Protokoll zugeteilt.</p>
    <div class="two-col roles-assignment-layout">
      <div class="roles-name-panel">
        <label for="newNameInput">Name hinzufügen</label>
        <div class="name-add-row">
          <input id="newNameInput" type="text" placeholder="Namen eingeben">
          <button id="addNameBtn" type="button" class="secondary">Hinzufügen</button>
        </div>
        <label>Liste der Gruppenmitglieder</label>
        <ul id="namesList" class="role-name-list" aria-live="polite"></ul>
        <textarea id="namesInput" class="visually-hidden" aria-hidden="true" tabindex="-1"></textarea>
        <div class="nav-row role-assign-actions"><button id="assignBtn" type="button">Zufällige Zuweisung</button></div>
        <p id="assignStatus" class="small"></p>
      </div>
      <div class="roles-result-panel">
        <h3>Zugewiesene Rollen</h3>
        <ul id="assignedBox" class="assigned-list assigned-list-modern"></ul>
      </div>
    </div>
  </section>
  <section class="roles-card-section">
    <div id="roleCards" class="role-cards-grid" style="display:none"></div>
  </section>
</main>
<footer><div class="wrap">QR-Codes führen direkt zu den jeweiligen Rollenkarten. Gruppen-ID: <span data-group-id></span></div></footer>
<script src="js/config.js"></script><script src="js/app.js?v=compact-protocol-v4"></script>
<script src="js/roles_flow_patch.js?v=compact-protocol-v4"></script>
<script src="js/editor_v6_patch.js?v=compact-protocol-v4"></script>
<script src="js/guided_flow_patch.js?v=guided-flow-v1"></script>
</body>
</html>
