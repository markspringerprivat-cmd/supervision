<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Präsentation starten</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;overflow:hidden;background:#071323;color:#fff;font-family:"Aptos","Segoe UI Variable","Segoe UI",Roboto,Arial,sans-serif}
    body{position:relative}
    .presenter{position:fixed;inset:0;background:radial-gradient(circle at 12% 18%,rgba(60,120,190,.28),transparent 30%),#071323;overflow:hidden}
    .stage{position:fixed;inset:6px;overflow:hidden;display:grid;place-items:center}
    .slide{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:translateX(70px) scale(.988);transition:opacity .32s ease,transform .42s cubic-bezier(.18,.82,.22,1);pointer-events:none}
    .slide.active{opacity:1;transform:translateX(0) scale(1);pointer-events:auto}
    .slide.prev{opacity:0;transform:translateX(-70px) scale(.988)}
    .slide img{max-width:99.6vw;max-height:99.1vh;width:auto;height:auto;border-radius:14px;box-shadow:0 30px 96px rgba(0,0,0,.45);background:#fff}
    .fullscreen-hint{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-18px);z-index:50;opacity:0;pointer-events:none;background:rgba(7,19,35,.94);border:1px solid rgba(255,255,255,.16);box-shadow:0 18px 44px rgba(0,0,0,.26);color:#fff;border-radius:999px;padding:11px 18px;font-weight:800;letter-spacing:.01em;transition:opacity .28s ease,transform .28s ease}
    .fullscreen-hint.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .start-overlay{position:fixed;right:18px;bottom:18px;z-index:40;display:flex;gap:10px;transition:opacity .25s ease,transform .25s ease}
    .start-overlay.hidden{opacity:0;transform:translateY(12px);pointer-events:none}
    button,a.button{border:0;border-radius:999px;padding:10px 15px;font-weight:850;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
    button.primary{background:#2f6fb0;color:#fff}
    a.light{background:#eef4fb;color:#10223a}
    @media(max-width:760px){
      .stage{inset:4px}
      .slide img{max-width:99.7vw;max-height:99.2vh;border-radius:10px}
      .fullscreen-hint{width:calc(100vw - 28px);text-align:center;border-radius:18px}
    }
  </style>
</head>
<body>
  <main class="presenter">
    <section id="stage" class="stage">
      <section class="slide active" data-slide="1"><img src="assets/ppt_slides/slide-01.png" alt="Folie 1"></section>
      <section class="slide" data-slide="2"><img src="assets/ppt_slides/slide-02.png" alt="Folie 2"></section>
      <section class="slide" data-slide="3"><img src="assets/ppt_slides/slide-03.png" alt="Folie 3"></section>
      <section class="slide" data-slide="4"><img src="assets/ppt_slides/slide-04.png" alt="Folie 4"></section>
      <section class="slide" data-slide="5"><img src="assets/ppt_slides/slide-05.png" alt="Folie 5"></section>
      <section class="slide" data-slide="6"><img src="assets/ppt_slides/slide-06.png" alt="Folie 6"></section>
      <section class="slide" data-slide="7"><img src="assets/ppt_slides/slide-07.png" alt="Folie 7"></section>
      <section class="slide" data-slide="8"><img src="assets/ppt_slides/slide-08.png" alt="Folie 8"></section>
      <section class="slide" data-slide="9"><img src="assets/ppt_slides/slide-09.png" alt="Folie 9"></section>
      <section class="slide" data-slide="10"><img src="assets/ppt_slides/slide-10.png" alt="Folie 10"></section>
      <section class="slide" data-slide="11"><img src="assets/ppt_slides/slide-11.png" alt="Folie 11"></section>
    </section>
    <div id="fullscreenHint" class="fullscreen-hint">Vollbildmodus mit Escape beenden</div>
    <div id="startOverlay" class="start-overlay">
      <button id="fullscreenBtn" class="primary" type="button">Vollbild starten (V)</button>
      <a class="button light" href="praesentation-nachschlagen.html">Zur Übersicht</a>
    </div>
  </main>
<script>
(function(){
  var slides=Array.from(document.querySelectorAll('.slide'));
  var current=0;
  var hintTimer=null;
  function update(){
    slides.forEach(function(s,i){
      s.classList.remove('active','prev');
      if(i===current)s.classList.add('active');
      else if(i<current)s.classList.add('prev');
    });
  }
  function next(){current=Math.min(slides.length-1,current+1);update();}
  function prev(){current=Math.max(0,current-1);update();}
  function showHint(){
    var hint=document.getElementById('fullscreenHint');
    if(!hint)return;
    clearTimeout(hintTimer);
    hint.classList.add('show');
    hintTimer=setTimeout(function(){hint.classList.remove('show');},4000);
  }
  function setOverlayVisible(visible){
    var overlay=document.getElementById('startOverlay');
    if(!overlay)return;
    overlay.classList.toggle('hidden',!visible);
  }
  function toggleFullscreen(){
    if(!document.fullscreenElement){
      var req=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
      if(req&&req.then)req.then(function(){showHint();}).catch(function(){showHint();});
      else showHint();
    }else{
      document.exitFullscreen&&document.exitFullscreen();
    }
  }
  document.getElementById('fullscreenBtn').onclick=toggleFullscreen;
  document.addEventListener('fullscreenchange',function(){
    var isFull=!!document.fullscreenElement;
    setOverlayVisible(!isFull);
    if(isFull)showHint();
  });
  document.addEventListener('keydown',function(ev){
    if(ev.key==='ArrowRight'||ev.key==='PageDown'||ev.key===' '){ev.preventDefault();next();}
    if(ev.key==='ArrowLeft'||ev.key==='PageUp'){ev.preventDefault();prev();}
    if((ev.key||'').toLowerCase()==='v'){ev.preventDefault();toggleFullscreen();}
    if((ev.key||'').toLowerCase()==='f'){ev.preventDefault();}
  });
  update();
})();
</script>
</body>
</html>
