<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ergebnisse aus den Gruppen</title>
  <link rel="stylesheet" href="css/styles.css?v=progress-presentation-v40">
</head>
<body data-mode="results">
<header>
  <div class="wrap topbar">
    <div><h1>Ergebnisse aus den Gruppen</h1><p>Zentrale Übersicht</p></div>
    <div class="header-actions">
      <button id="adminLoginBtn" class="secondary" type="button">Administrator</button>
      <button id="deleteAllBtn" class="danger admin-only" type="button" hidden>Alle Gruppenergebnisse löschen</button>
    </div>
  </div>
</header>
<main class="wide-main">
  <section class="card highlight">
    <h2>Zentrale Ergebnisübersicht</h2>
    <p>Hier erscheinen die abgesendeten Gruppenergebnisse. Die Administrationsfunktionen können oben freigeschaltet werden.</p>
    <p id="resultsStatus" class="small">Ergebnisse werden geladen …</p>
  </section>
  <section class="carousel-controls card compact" id="resultsControls">
    <div class="random-area admin-only"><button id="randomGroupBtn" type="button">Zufallsauswahl starten</button><button id="resetRoundsBtn" class="secondary" type="button">Runden zurücksetzen</button><div id="roundBadges" class="round-badges" aria-label="Rundenmarkierungen"></div></div>
  </section>
  <div class="carousel-nav carousel-nav-floating" aria-label="Gruppen wechseln">
    <button id="prevGroupBtn" type="button" class="secondary" aria-label="Vorherige Gruppe">←</button>
    <span id="carouselCounter" class="small">0 / 0</span>
    <button id="nextGroupBtn" type="button" class="secondary" aria-label="Nächste Gruppe">→</button>
  </div>
  <section class="result-carousel" id="resultCarousel" aria-label="Gruppenergebnisse">
    <div id="resultsContent" class="result-track"></div>
  </section>
  <div class="nav-row"><a class="button secondary" href="index.html">Zur Startseite</a></div>
</main>
<footer><div class="wrap">Gruppen-ID: <span data-group-id></span></div></footer>
<script src="js/config.js?v=progress-presentation-v40"></script><script src="js/app.js?v=progress-presentation-v40"></script>
<script src="js/roles_flow_patch.js?v=progress-presentation-v40"></script>
<script src="js/editor_v6_patch.js?v=editor-v8-handoff"></script>
<script src="js/guided_flow_patch.js?v=progress-presentation-v40"></script>
</body>
</html>
