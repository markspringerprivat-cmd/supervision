<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supervisionssprint – Leaderboard</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  body{margin:0;font-family:Aptos,"Segoe UI",Arial,sans-serif;background:linear-gradient(135deg,#0b1b33,#183a63);color:#10223a}
  header{background:rgba(255,255,255,.08);color:white}
  .wrap{width:min(1100px,calc(100vw - 32px));margin:auto}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 0}
  .button,button{border:0;border-radius:999px;padding:11px 16px;font-weight:850;text-decoration:none;cursor:pointer}
  .button{background:#fff;color:#10223a}.secondary{background:#eaf2fb;color:#10223a}
  main{width:min(1100px,calc(100vw - 32px));margin:24px auto 80px}
  .panel{background:white;border-radius:26px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
  table{width:100%;border-collapse:collapse;margin-top:14px}
  th,td{border-bottom:1px solid #e2ebf4;padding:12px;text-align:left}
  th{color:#34516e;font-size:.85rem;text-transform:uppercase;letter-spacing:.04em}
  .rank{font-size:1.25rem;font-weight:950;color:#2f6fb0}
  .status{color:white;font-weight:850;margin:14px 0}
  @media(max-width:720px){.topbar{align-items:flex-start;flex-direction:column}.panel{padding:16px;border-radius:20px}th:nth-child(5),td:nth-child(5){display:none}}
</style>
</head>
<body data-mode="sprint-leaderboard">
<header><div class="wrap topbar"><div><h1>Supervisionssprint</h1><p>Leaderboard aller gespeicherten Spielstände.</p></div><a class="button" href="index.html">Zur Startseite</a></div></header>
<main>
<p id="status" class="status">Leaderboard wird geladen …</p>
<section class="panel">
  <h2>Highscores</h2>
  <div id="board"></div>
</section>
</main>
<script src="js/config.js?v=admin-ui-sprint-leaderboard-v96"></script>
<script src="js/app.js?v=admin-ui-sprint-leaderboard-v96"></script>
<script>
(function(){
  function appUrl(){try{if(typeof getAppsScriptUrl==='function')return getAppsScriptUrl()}catch(_){}return(window.SUPERVISION_CONFIG&&window.SUPERVISION_CONFIG.APPS_SCRIPT_URL)||''}
  function jsonp(url,params){return new Promise(function(resolve,reject){var cb='sprintBoardCb_'+Date.now()+'_'+Math.floor(Math.random()*1e9),qs=new URLSearchParams(params||{}),s=document.createElement('script'),done=false;qs.set('callback',cb);qs.set('_',Date.now());window[cb]=function(data){done=true;cleanup();resolve(data)};function cleanup(){try{delete window[cb]}catch(_){}if(s.parentNode)s.parentNode.removeChild(s)}s.onerror=function(){if(!done){cleanup();reject(new Error('Apps Script konnte nicht erreicht werden.'))}};s.src=url+(url.indexOf('?')>=0?'&':'?')+qs.toString();document.body.appendChild(s);setTimeout(function(){if(!done){cleanup();reject(new Error('Zeitüberschreitung.'))}},12000)})}
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function render(entries){var box=document.getElementById('board');if(!entries.length){box.innerHTML='<p>Es wurden noch keine Highscores übertragen.</p>';return}box.innerHTML='<table><thead><tr><th>Platz</th><th>Name</th><th>Highscore</th><th>Gelöst</th><th>Gruppe</th><th>Zeitpunkt</th></tr></thead><tbody>'+entries.map(function(e,i){return '<tr><td class="rank">'+(i+1)+'</td><td>'+esc(e.name||'Unbekannt')+'</td><td><strong>'+Number(e.score||0)+'</strong></td><td>'+Number(e.solved||0)+'</td><td>'+esc(e.groupId||'')+'</td><td>'+esc(e.timestamp||'')+'</td></tr>'}).join('')+'</tbody></table>'}
  async function boot(){var url=appUrl(),status=document.getElementById('status');if(!url){status.textContent='Keine Apps-Script-URL gefunden.';return}try{var data=await jsonp(url,{action:'listSprintHighscores'});if(!data||data.ok===false)throw new Error(data&&data.error||'Keine Daten erhalten.');render(data.entries||[]);status.textContent='Leaderboard geladen.'}catch(err){status.textContent='Fehler: '+err.message}}
  document.addEventListener('DOMContentLoaded',boot);
})();
</script>
</body>
</html>
