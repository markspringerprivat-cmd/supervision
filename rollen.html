<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rollenverteilung</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-mode="roles">
<header><div class="wrap"><h1>Rollenverteilung</h1><p>Gruppe bilden und Rollen zufällig zuweisen</p></div></header>
<main class="wide-main">
  <section class="card">
    <h2>Namen eintragen</h2>
    <p class="small">Mindestens 4 Namen. Bei 5 Personen wird die fünfte Person als Protokoll / Beobachtung zugeteilt.</p>
    <div class="two-col">
      <div>
        <label for="namesInput">Namen der Gruppenmitglieder</label>
        <textarea id="namesInput" placeholder="Name 1&#10;Name 2&#10;Name 3&#10;Name 4"></textarea>
        <div class="nav-row"><button id="assignBtn">Zufällige Zuweisung</button><a class="button secondary" href="index.html">Zur Startseite</a></div>
        <p id="assignStatus" class="small"></p>
      </div>
      <div>
        <h3>Zugewiesene Rollen</h3>
        <ul id="assignedBox" class="assigned-list"></ul>
      </div>
    </div>
  </section>
  <section style="margin-top:18px">
    <div id="roleCards" class="grid" style="display:none"></div>
  </section>
</main>
<footer><div class="wrap">QR-Codes führen direkt zu den jeweiligen Rollenkarten. Gruppen-ID: <span data-group-id></span></div></footer>
<script src="js/config.js"></script><script src="js/app.js"></script>
<script src="js/editor_v6_patch.js?v=v8-pattern-toolbar"></script>
</body>
</html>
