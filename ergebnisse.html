<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ergebnisse aus den Gruppen</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-mode="results">
<header><div class="wrap topbar"><div><h1>Ergebnisse aus den Gruppen</h1><p>Zentrale Übersicht</p></div><button id="deleteAllBtn" class="danger">Alle Ergebnisse löschen</button></div></header>
<main>
  <section class="card highlight">
    <h2>Zentrale Ergebnisübersicht</h2>
    <p>Hier erscheinen die abgesendeten Gruppenergebnisse. Die einzelnen Phasen können pro Gruppe geöffnet werden.</p>
    <p id="resultsStatus" class="small">Ergebnisse werden geladen …</p>
  </section>
  <div id="resultsContent" class="grid" style="margin-top:18px"></div>
  <div class="nav-row"><a class="button secondary" href="index.html">Zur Startseite</a></div>
</main>
<footer><div class="wrap">Gruppen-ID: <span data-group-id></span></div></footer>
<script src="js/config.js"></script><script src="js/app.js"></script>
</body>
</html>
