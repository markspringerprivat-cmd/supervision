<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Präsentation Gruppenergebnis</title>
  <link rel="stylesheet" href="css/styles.css?v=standalone-sync-1">
  <style>
    :root{--ps-bg:#071323;--ps-slide:#fff;--ps-heading:#1e3a5f;--ps-text:#0f172a;}
    body.presentation-body{margin:0;min-height:100vh;background:var(--ps-bg);color:var(--ps-text);overflow:hidden;}
    .presentation-shell{max-width:none;width:100vw;height:100vh;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:transparent;}
    .presentation-toolbar{position:fixed;top:0;left:0;right:0;z-index:2000;display:flex;align-items:center;gap:12px;padding:8px 12px;background:rgba(7,19,35,.92);border-bottom:1px solid rgba(255,255,255,.12);}
    .presentation-toolbar button{border:0;border-radius:10px;padding:10px 16px;font-weight:700;}
    .presentation-toolbar button.secondary{background:#f1f5f9;color:#0f172a;}
    .presentation-toolbar button:not(.secondary){background:#274c77;color:#fff;}
    .presentation-counter{margin-left:auto;color:#fff;font-weight:800;}
    .presentation-status{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:2100;background:#fff;border:1px solid #d8dde8;border-radius:14px;padding:18px 22px;box-shadow:0 18px 40px rgba(0,0,0,.18);font-weight:700;}
    .presentation-status.warning{background:#fff7ed;color:#8a5b00;border-color:#fed7aa;}
    #presentationSlide.presentation-slide{position:relative;width:min(82vw,1280px);aspect-ratio:16/9;height:auto;margin-top:42px;border-radius:18px;background:var(--ps-slide);box-shadow:0 24px 70px rgba(0,0,0,.34);overflow:hidden;color:var(--ps-text);}
    .ps-inner{position:relative;width:100%;height:100%;overflow:hidden;}
    .ps-el{box-sizing:border-box;line-height:1.16;overflow:hidden;}
    .ps-title{font-weight:850;color:var(--ps-heading);letter-spacing:-.03em;}
    .ps-kicker{font-weight:750;}
    .ps-heading2{font-weight:850;letter-spacing:-.025em;}
    .ps-subtitle{font-weight:650;line-height:1.35;}
    .ps-note{font-weight:750;line-height:1.3;}
    .ps-table-wrap{width:100%;height:100%;overflow:visible;}
    .ps-table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid #d9e1ec;border-radius:10px;overflow:hidden;font-size:.78em;line-height:1.25;}
    .ps-table th,.ps-table td{border-right:1px solid #d9e1ec;border-bottom:1px solid #e7edf5;padding:.62em .75em;text-align:left;vertical-align:top;white-space:normal;overflow-wrap:anywhere;}
    .ps-table th{background:#e9eff7;font-weight:850;}
    .ps-table tr:last-child td{border-bottom:0;}
    .ps-table th:last-child,.ps-table td:last-child{border-right:0;}
    .ps-thanks{display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;color:var(--ps-heading);font-weight:850;}
    .ps-thanks h2{font-size:1em;margin:0 0 .25em;}
    .ps-thanks p{font-size:.34em;margin:0;color:var(--ps-text);}
    .ps-extra,.ps-sticker{position:absolute;box-sizing:border-box;transform-origin:center center;}
    .ps-extra{white-space:pre-wrap;overflow:hidden;line-height:1.25;font-weight:650;}
    .ps-sticker{object-fit:contain;pointer-events:none;}
    .presentation-nav{position:fixed;left:0;right:0;bottom:18px;z-index:2000;display:flex;justify-content:center;gap:12px;}
    .presentation-nav button{border:0;border-radius:10px;padding:12px 20px;font-weight:900;background:#274c77;color:#fff;}
    .presentation-nav button.secondary{background:#f1f5f9;color:#0f172a;}
    .presentation-nav button:disabled{opacity:.45;}
    @media (max-width:900px) and (orientation:landscape){
      .presentation-toolbar{padding:5px 8px;gap:8px;}
      .presentation-toolbar button{padding:7px 10px;font-size:12px;}
      #presentationSlide.presentation-slide{width:calc(100vw - 150px);margin-top:28px;}
      .presentation-nav{top:50%;bottom:auto;left:0;right:0;justify-content:space-between;transform:translateY(-50%);padding:0 12px;pointer-events:none;}
      .presentation-nav button{pointer-events:auto;border-radius:999px;width:54px;height:78px;padding:0;font-size:24px;}
    }
    @media (max-width:700px) and (orientation:portrait){
      body.presentation-body:before{content:'Bitte das Smartphone quer halten';position:fixed;z-index:3000;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;color:#0f172a;border-radius:18px;padding:22px;width:min(86vw,360px);text-align:center;font-weight:850;box-shadow:0 18px 40px rgba(0,0,0,.3);}
      #presentationSlide.presentation-slide{width:86vw;margin-top:80px;}
      .presentation-toolbar{display:none;}
      .presentation-nav{display:none;}
    }
  </style>
</head>
<body data-mode="presentation" class="presentation-body">
  <main class="presentation-shell">
    <div class="presentation-toolbar" role="toolbar" aria-label="Präsentationssteuerung">
      <button id="presentationExitBtn" type="button" class="secondary">Präsentation abbrechen</button>
      <button id="presentationFullscreenBtn" type="button">Vollbildmodus</button>
      <span id="presentationCounter" class="presentation-counter">1 / 6</span>
    </div>
    <section id="presentationStatus" class="presentation-status">Präsentation wird geladen …</section>
    <section id="presentationSlide" class="presentation-slide" aria-live="polite"></section>
    <div class="presentation-nav">
      <button id="presentationPrevBtn" class="secondary" type="button" aria-label="Zurück">←</button>
      <button id="presentationNextBtn" type="button" aria-label="Weiter">→</button>
    </div>
  </main>
  <script src="js/config.js?v=standalone-sync-1"></script>
  <script src="js/presentation_sync_standalone.js?v=standalone-sync-1"></script>
</body>
</html>
