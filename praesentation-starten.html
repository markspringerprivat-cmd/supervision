<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Präsentation starten</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;overflow:hidden;background:#071323;color:#fff;font-family:"Aptos","Segoe UI Variable","Segoe UI",Roboto,Arial,sans-serif}
    body{position:relative}
    .presenter{position:fixed;inset:0;background:radial-gradient(circle at 12% 18%,rgba(60,120,190,.28),transparent 30%),#071323;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
    .stage{position:fixed;inset:6px;overflow:hidden;display:grid;place-items:center}
    .slide{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:translateX(70px) scale(.988);transition:opacity .32s ease,transform .42s cubic-bezier(.18,.82,.22,1);pointer-events:none}
    .slide.active{opacity:1;transform:translateX(0) scale(1);pointer-events:auto}
    .slide.prev{opacity:0;transform:translateX(-70px) scale(.988)}
    .slide img{max-width:99.6vw;max-height:99.1vh;width:auto;height:auto;border-radius:14px;box-shadow:0 30px 96px rgba(0,0,0,.45);background:#fff}
    .fullscreen-hint{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-18px);z-index:50;opacity:0;pointer-events:none;background:rgba(7,19,35,.94);border:1px solid rgba(255,255,255,.16);box-shadow:0 18px 44px rgba(0,0,0,.26);color:#fff;border-radius:999px;padding:11px 18px;font-weight:800;letter-spacing:.01em;transition:opacity .28s ease,transform .28s ease}
    .fullscreen-hint.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .start-overlay{position:fixed;right:18px;bottom:18px;z-index:40;display:flex;gap:10px;transition:opacity .25s ease,transform .25s ease}.mobile-nav{position:fixed;right:calc(10px + env(safe-area-inset-right));top:50%;transform:translateY(-50%);z-index:45;display:none;flex-direction:column;align-items:stretch;gap:8px;pointer-events:none}.mobile-nav button,.mobile-nav a{pointer-events:auto;width:108px;min-height:40px;border-radius:14px;padding:8px 9px;font-size:.86rem;font-weight:900;background:rgba(238,244,251,.95);color:#10223a;box-shadow:0 10px 28px rgba(0,0,0,.22);text-align:center;text-decoration:none}.mobile-nav button.primary{background:rgba(47,111,176,.96);color:#fff}.mobile-nav button.mobile-fullscreen-disabled{background:rgba(238,244,251,.62);color:#6b7f94;cursor:not-allowed;opacity:.78}.tap-zone{position:fixed;top:0;bottom:0;z-index:20;background:transparent}.tap-zone.left{left:0;width:28vw}.tap-zone.right{right:0;width:72vw}.mobile-start{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:rgba(7,19,35,.78);padding:24px}.mobile-start-card{width:min(520px,calc(100vw - 32px));background:#fff;color:#10223a;border-radius:26px;padding:24px;text-align:center;box-shadow:0 28px 80px rgba(0,0,0,.38)}.mobile-start-card h2{margin:0 0 10px}.mobile-start-card p{color:#607187;line-height:1.5}.mobile-start-card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
    .start-overlay.hidden{opacity:0;transform:translateY(12px);pointer-events:none}
    button,a.button{border:0;border-radius:999px;padding:10px 15px;font-weight:850;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
    button.primary{background:#2f6fb0;color:#fff}
    a.light{background:#eef4fb;color:#10223a}
    @media(max-width:760px){
      .stage{inset:4px}
      .slide img{max-width:99.7vw;max-height:99.2vh;border-radius:10px}
      .fullscreen-hint{width:calc(100vw - 28px);text-align:center;border-radius:18px}
      .start-overlay{display:none}
      .mobile-nav{display:flex}
      .mobile-start{display:grid}
      .slide img{max-width:calc(100vw - 132px);max-height:100dvh}
    }
    @media(max-width:760px) and (orientation:portrait){
      .mobile-nav{right:8px;top:auto;bottom:calc(10px + env(safe-area-inset-bottom));transform:none;flex-direction:row;justify-content:flex-end;left:8px}
      .mobile-nav button,.mobile-nav a{width:auto;min-width:72px;font-size:.82rem;padding:8px 9px}
      .slide img{max-width:100vw;max-height:calc(100dvh - 58px)}
    }
    @media(pointer:coarse){
      .mobile-nav{display:flex}
    }
  </style>
</head>
<body>
  <main class="presenter">
    <section id="stage" class="stage">
      <section class="slide active" data-slide="1"><img src="assets/ppt_slides/slide-01.png" alt="Folie 1"></section>
      <section class="slide" data-slide="2"><img src="assets/ppt_slides/slide-02.png" alt="Folie 2"></section>
      <section class="slide" data-slide="3"><img src="assets/ppt_slides/slide-03.png" alt="Folie 3"></section>
      <section class="slide" data-slide="4"><img src="assets/ppt_slides/slide-04.png" alt="Folie 4"></section>
      <section class="slide" data-slide="5"><img src="assets/ppt_slides/slide-05.png" alt="Folie 5"></section>
      <section class="slide" data-slide="6"><img src="assets/ppt_slides/slide-06.png" alt="Folie 6"></section>
      <section class="slide" data-slide="7"><img src="assets/ppt_slides/slide-07.png" alt="Folie 7"></section>
      <section class="slide" data-slide="8"><img src="assets/ppt_slides/slide-08.png" alt="Folie 8"></section>
      <section class="slide" data-slide="9"><img src="assets/ppt_slides/slide-09.png" alt="Folie 9"></section>
      <section class="slide" data-slide="10"><img src="assets/ppt_slides/slide-10.png" alt="Folie 10"></section>
      <section class="slide" data-slide="11"><img src="assets/ppt_slides/slide-11.png" alt="Folie 11"></section>
    </section>
    <div id="fullscreenHint" class="fullscreen-hint">Tippen rechts: weiter · links: zurück</div>
    <div class="tap-zone left" id="tapPrev" aria-hidden="true"></div>
    <div class="tap-zone right" id="tapNext" aria-hidden="true"></div>
    <div id="mobileNav" class="mobile-nav" aria-label="Mobile Foliennavigation">
      <button id="mobileNextBtn" type="button">Weiter →</button>
      <button id="mobilePrevBtn" type="button">← Zurück</button>
      <button id="mobileFullscreenBtn" class="mobile-fullscreen-disabled" type="button" aria-disabled="true" disabled>Vollbild</button>
      <a class="button light" href="praesentation-nachschlagen.html">Übersicht</a>
    </div>
    <div id="mobileStart" class="mobile-start">
      <div class="mobile-start-card">
        <h2>Präsentation starten</h2>
        <p>Halte das Gerät am besten quer. Tippe rechts auf den Bildschirm, um weiterzublättern, oder nutze die kleine Leiste am rechten Rand.</p>
        <div class="row">
          <button id="mobileStartBtn" class="primary" type="button">Starten</button>
          <a class="button light" href="praesentation-nachschlagen.html">Zur Übersicht</a>
        </div>
      </div>
    </div>
    <div id="startOverlay" class="start-overlay">
      <button id="fullscreenBtn" class="primary" type="button">Vollbild starten (V)</button>
      <a class="button light" href="praesentation-nachschlagen.html">Zur Übersicht</a>
    </div>
  </main>
<script>
(function(){
  var slides=Array.from(document.querySelectorAll('.slide'));
  var current=0;
  var hintTimer=null;
  var touchStartX=0;
  var touchStartY=0;
  var lastTapTime=0;

  function isMobileLike(){
    return (window.matchMedia && (window.matchMedia('(pointer: coarse)').matches || window.matchMedia('(max-width: 760px)').matches));
  }
  function update(){
    slides.forEach(function(s,i){
      s.classList.remove('active','prev');
      if(i===current)s.classList.add('active');
      else if(i<current)s.classList.add('prev');
    });
  }
  function next(){current=Math.min(slides.length-1,current+1);update();}
  function prev(){current=Math.max(0,current-1);update();}
  function showHint(text){
    var hint=document.getElementById('fullscreenHint');
    if(!hint)return;
    if(text) hint.textContent=text;
    clearTimeout(hintTimer);
    hint.classList.add('show');
    hintTimer=setTimeout(function(){hint.classList.remove('show');},3500);
  }
  function setOverlayVisible(visible){
    var overlay=document.getElementById('startOverlay');
    if(overlay) overlay.classList.toggle('hidden',!visible);
  }
  function hideMobileStart(){
    var start=document.getElementById('mobileStart');
    if(start) start.style.display='none';
  }
  function enterFullscreen(){
    var el=document.documentElement;
    var fn=el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if(!fn){
      showHint('Vollbild wird von diesem Browser nicht unterstützt. Querformat nutzen.');
      return Promise.resolve(false);
    }
    try{
      var res=fn.call(el);
      if(res && res.then){
        return res.then(function(){showHint('Vollbildmodus aktiv. Tippen rechts: weiter.');return true;}).catch(function(){
          showHint('Vollbild wurde blockiert. Bitte Browser-Menü oder Querformat nutzen.');
          return false;
        });
      }
      showHint('Vollbildmodus aktiv. Tippen rechts: weiter.');
      return Promise.resolve(true);
    }catch(e){
      showHint('Vollbild wurde blockiert. Bitte Browser-Menü oder Querformat nutzen.');
      return Promise.resolve(false);
    }
  }
  function exitFullscreen(){
    var fn=document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if(fn) try{fn.call(document);}catch(e){}
  }
  function toggleFullscreen(){
    if(!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement)) return enterFullscreen();
    exitFullscreen();
    return Promise.resolve(true);
  }
  function startMobilePresentation(){
    hideMobileStart();
    showHint('Tippen rechts: weiter · links: zurück');
  }

  document.getElementById('fullscreenBtn')?.addEventListener('click',function(){toggleFullscreen();});
  document.getElementById('mobileFullscreenBtn')?.addEventListener('click',function(ev){ev.stopPropagation();showHint('Vollbild ist auf mobilen Browsern nicht zuverlässig verfügbar. Bitte Gerät quer halten.');});
  document.getElementById('mobileStartBtn')?.addEventListener('click',function(ev){ev.stopPropagation();startMobilePresentation();});
  document.getElementById('mobilePrevBtn')?.addEventListener('click',function(ev){ev.stopPropagation();prev();});
  document.getElementById('mobileNextBtn')?.addEventListener('click',function(ev){ev.stopPropagation();next();});
  document.getElementById('tapPrev')?.addEventListener('click',function(ev){ev.stopPropagation();prev();});
  document.getElementById('tapNext')?.addEventListener('click',function(ev){ev.stopPropagation();next();});

  document.addEventListener('fullscreenchange',function(){
    var isFull=!!document.fullscreenElement;
    setOverlayVisible(!isFull);
    if(isFull){hideMobileStart();showHint('Tippen rechts: weiter · links: zurück');}
  });
  document.addEventListener('webkitfullscreenchange',function(){
    var isFull=!!document.webkitFullscreenElement;
    setOverlayVisible(!isFull);
    if(isFull){hideMobileStart();showHint('Tippen rechts: weiter · links: zurück');}
  });

  document.addEventListener('keydown',function(ev){
    if(ev.key==='ArrowRight'||ev.key==='PageDown'||ev.key===' '){ev.preventDefault();next();}
    if(ev.key==='ArrowLeft'||ev.key==='PageUp'){ev.preventDefault();prev();}
    if((ev.key||'').toLowerCase()==='v'){ev.preventDefault();toggleFullscreen();}
    if((ev.key||'').toLowerCase()==='f'){ev.preventDefault();}
  });

  document.addEventListener('touchstart',function(ev){
    if(!ev.touches || !ev.touches.length)return;
    touchStartX=ev.touches[0].clientX;
    touchStartY=ev.touches[0].clientY;
  },{passive:true});

  document.addEventListener('touchend',function(ev){
    if(ev.target && ev.target.closest && ev.target.closest('button,a')) return;
    var t=ev.changedTouches && ev.changedTouches[0];
    if(!t)return;
    var dx=t.clientX-touchStartX;
    var dy=t.clientY-touchStartY;
    if(Math.abs(dx)>44 && Math.abs(dx)>Math.abs(dy)){
      if(dx<0) next(); else prev();
      return;
    }
    if(Math.abs(dx)<18 && Math.abs(dy)<18){
      var now=Date.now();
      if(now-lastTapTime<260) return;
      lastTapTime=now;
      if(t.clientX < window.innerWidth*0.32) prev(); else next();
    }
  },{passive:true});

  if(isMobileLike()){
    showHint('Tippen rechts: weiter · links: zurück');
  }else{
    var start=document.getElementById('mobileStart');
    if(start) start.style.display='none';
  }
  update();
})();
</script>
<script src="js/role_personalizer_v62.js?v=admin-ui-sprint-leaderboard-v96"></script>
</body>
</html>
