<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manometer – Auswertung</title>
  <link rel="stylesheet" href="css/styles.css?v=manometer-admin-reset-v1">
  <style>
    :root{
      --bg:#0b1324;
      --bg2:#13213a;
      --panel:rgba(255,255,255,.92);
      --panel-strong:#ffffff;
      --text:#122033;
      --muted:#5e7289;
      --line:#d8e3ef;
      --accent:#295f99;
      --accent-2:#5c95d1;
      --danger:#c53b37;
      --shadow:0 24px 80px rgba(7,19,35,.25);
      --radius:28px;
    }
    *{box-sizing:border-box}
    body[data-mode="manometer-results"]{
      min-height:100vh;
      margin:0;
      color:var(--text);
      background:
        radial-gradient(circle at top left, rgba(92,149,209,.35), transparent 32%),
        radial-gradient(circle at top right, rgba(74,222,128,.16), transparent 24%),
        linear-gradient(140deg, var(--bg), var(--bg2));
      overflow-x:hidden;
    }
    body[data-mode="manometer-results"] header,
    body[data-mode="manometer-results"] footer{display:none}

    .results-shell{min-height:100vh;display:flex;flex-direction:column;padding:20px 20px 28px;gap:18px}
    .topbar{
      display:flex;align-items:center;justify-content:space-between;gap:16px;
      background:rgba(255,255,255,.1);backdrop-filter:blur(18px);
      border:1px solid rgba(255,255,255,.14);border-radius:24px;color:#fff;
      padding:16px 18px;box-shadow:0 10px 30px rgba(0,0,0,.18)
    }
    .brand h1{margin:0;font-size:1.3rem;font-weight:950;letter-spacing:.01em}
    .brand p{margin:4px 0 0;color:rgba(255,255,255,.78);font-size:.95rem}
    .topbar-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
    .meta-pill{
      padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.12);
      color:#fff;font-weight:800;border:1px solid rgba(255,255,255,.18)
    }
    .topbar .button, .topbar button{
      border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.12);
      color:#fff;padding:11px 16px;font-weight:800;cursor:pointer
    }
    .topbar .button.secondary, .topbar button.secondary{background:rgba(255,255,255,.06)}

    .progress-wrap{position:relative;height:10px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden;border:1px solid rgba(255,255,255,.12)}
    .progress-bar{height:100%;width:0;background:linear-gradient(90deg,#7ab3f0,#d4ebff);transition:width .35s ease}

    .stage{
      flex:1;display:flex;align-items:center;justify-content:center;min-height:0;
    }
    .deck{
      position:relative;width:min(1360px,100%);height:min(78vh,880px);min-height:560px;
    }
    .slide{
      position:absolute;inset:0;display:flex;flex-direction:column;
      background:var(--panel);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.48);
      border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;
      opacity:0;transform:translateX(90px) scale(.96);pointer-events:none;
      transition:transform .55s cubic-bezier(.2,.8,.2,1), opacity .45s ease;
    }
    .slide.active{opacity:1;transform:translateX(0) scale(1);pointer-events:auto;z-index:3}
    .slide.prev{opacity:0;transform:translateX(-110px) scale(.95);z-index:1}
    .slide.next{opacity:0;transform:translateX(110px) scale(.95);z-index:1}
    .slide-inner{display:flex;flex-direction:column;height:100%;padding:34px 34px 28px;overflow:auto}

    .intro-hero{
      background:linear-gradient(135deg,#eff6ff,#ffffff 60%,#eefaf3);
      border:1px solid #dde8f2;border-radius:24px;padding:24px 24px 18px;
      box-shadow:0 18px 50px rgba(15,23,42,.08)
    }
    .intro-hero h2,.slide h2{margin:0 0 12px;font-size:clamp(1.45rem,2vw,2.2rem);line-height:1.15;font-weight:950}
    .intro-hero p{margin:0;color:var(--muted);font-size:1.02rem;line-height:1.55}
    .summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:18px}
    .summary-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 12px 28px rgba(15,23,42,.06)}
    .summary-card strong{display:block;font-size:2rem;color:#16355b;line-height:1;font-weight:950}
    .summary-card span{display:block;margin-top:8px;font-weight:700;color:var(--muted)}

    .slide-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}
    .slide-label{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:#eaf2fb;color:#234972;font-weight:900;text-transform:uppercase;letter-spacing:.05em;font-size:.78rem}
    .slide-counter{color:var(--muted);font-weight:800;white-space:nowrap}

    .metric-row{display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:stretch}
    .avg-box{
      border-radius:24px;background:linear-gradient(160deg,#1f4b7a,#3b77b8);color:#fff;padding:26px;
      display:flex;flex-direction:column;justify-content:center;min-height:220px;box-shadow:0 18px 40px rgba(31,75,122,.24)
    }
    .avg-box strong{display:block;font-size:4rem;line-height:1;font-weight:950;margin-bottom:10px}
    .avg-box .sub{font-weight:800;font-size:1.05rem;color:rgba(255,255,255,.92)}
    .avg-box .mini{margin-top:14px;color:rgba(255,255,255,.82);font-weight:700}

    .scale-viz{position:relative;border:1px solid var(--line);border-radius:24px;padding:28px 20px 22px;background:linear-gradient(180deg,#f8fbff,#f4f8fc);min-height:220px}
    .scale-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}
    .scale-title{font-weight:900;color:#1c395d}
    .scale-sub{font-size:.92rem;color:var(--muted)}
    .distribution{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;align-items:end;min-height:112px;margin-top:14px;padding-top:14px;border-top:1px solid #e0e7f1}
    .column{display:flex;flex-direction:column;align-items:center;gap:8px}
    .stack{display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;gap:5px;min-height:82px}
    .dot{width:12px;height:12px;border-radius:999px;background:linear-gradient(180deg,#2d69a6,#173d68);box-shadow:0 2px 6px rgba(45,105,166,.25)}
    .tick{font-weight:900;color:#46607c;font-size:.92rem}
    .count-badge{font-size:.76rem;font-weight:800;color:#667b92;min-height:18px}
    .median-marker{position:absolute;top:65px;bottom:42px;width:3px;background:var(--danger);border-radius:999px;box-shadow:0 0 0 6px rgba(197,59,55,.08)}
    .median-marker::before{content:'Median';position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:.76rem;font-weight:900;color:var(--danger);white-space:nowrap}

    .comments{margin-top:24px;border-top:1px solid #e6edf4;padding-top:22px}
    .comments h3,.text-block h3{margin:0 0 12px;font-size:1.06rem;color:#193557}
    .comment-list,.text-card-list{display:grid;gap:12px}
    .comment,.text-entry{border-radius:16px;padding:14px 16px;background:#f8fbff;border:1px solid #dfe8f1;color:#20344c;white-space:pre-wrap;line-height:1.5}
    .empty{color:var(--muted);font-style:italic;margin:0}

    .choice-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:8px}
    .choice-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 12px 24px rgba(15,23,42,.05)}
    .choice-card strong{display:block;font-size:2rem;color:#16355b;line-height:1;font-weight:950}
    .choice-card span{display:block;margin-top:8px;font-weight:700;color:var(--muted)}

    .nav-dock{
      display:flex;align-items:center;justify-content:space-between;gap:16px;
      background:rgba(255,255,255,.1);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.14);
      border-radius:24px;padding:14px 16px;color:#fff
    }
    .nav-left,.nav-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .nav-center{font-weight:800;color:rgba(255,255,255,.85)}
    .nav-dock button,.nav-dock a{
      border:none;border-radius:999px;padding:12px 18px;font-weight:900;cursor:pointer;text-decoration:none
    }
    .nav-dock .primary{background:#fff;color:#16355b}
    .nav-dock .secondary{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.16)}
    .nav-dock button:disabled{opacity:.45;cursor:not-allowed}
    .status{margin:0;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.12)}
    .present-tip{font-size:.92rem;color:rgba(255,255,255,.8)}

    .fs body[data-mode="manometer-results"] .results-shell{padding:14px}
    @media (max-width:980px){
      .metric-row,.summary-grid,.choice-grid{grid-template-columns:1fr}
      .deck{height:min(76vh,940px);min-height:620px}
    }
    @media (max-width:720px){
      .results-shell{padding:14px;gap:14px}
      .topbar,.nav-dock{border-radius:20px}
      .topbar{flex-direction:column;align-items:flex-start}
      .topbar-right,.nav-left,.nav-right{width:100%}
      .nav-dock{flex-direction:column;align-items:stretch}
      .nav-center{text-align:center}
      .slide-inner{padding:24px 20px 20px}
      .deck{height:74vh;min-height:560px}
      .avg-box strong{font-size:3rem}
    }
  </style>
</head>
<body data-mode="manometer-results">
<main class="results-shell">
  <section class="topbar">
    <div class="brand">
      <h1>Manometer – Auswertung</h1>
      <p>Moderne Präsentationsansicht für die anonyme Rückmeldung aller Geräte.</p>
    </div>
    <div class="topbar-right">
      <span class="meta-pill"><span id="responseCount">0</span> Rückmeldungen</span>
      <button id="fullscreenBtn" type="button">Vollbild starten</button>
      <a class="button secondary" href="manometer.html">Feedback abgeben</a>
      <a class="button secondary" href="index.html">Startseite</a>
    </div>
  </section>

  <div class="progress-wrap" aria-hidden="true"><div id="progressBar" class="progress-bar"></div></div>

  <section class="stage" aria-live="polite">
    <div id="deck" class="deck"></div>
  </section>

  <section class="nav-dock">
    <div class="nav-left">
      <button id="prevCard" type="button" class="secondary">← Zurück</button>
      <button id="nextCard" type="button" class="primary">Weiter →</button>
    </div>
    <div class="nav-center">
      <span id="slideCounter">Kachel 1 / 1</span><br>
      <span class="present-tip">Tipp: Im Vollbild mit den Pfeiltasten durch die Präsentation navigieren.</span>
    </div>
    <div class="nav-right">
      <p id="status" class="status">Auswertung wird geladen …</p>
    </div>
  </section>
</main>
<script src="js/config.js?v=manometer-admin-reset-v1"></script>
<script src="js/app.js?v=manometer-admin-reset-v1"></script>
<script>
(function(){
  var QUESTIONS = [
    {key:'presentationPressure', category:'Startfrage', label:'Die Aussicht auf eine zufällige Präsentation im Plenum hat dazu geführt, dass die Aufgaben gewissenhafter bearbeitet wurden.'},
    {key:'caseConsultation', category:'Inhaltliches Verständnis', label:'Ich kenne verschiedene Arten der Fallberatung.'},
    {key:'phaseUnderstanding', category:'Inhaltliches Verständnis', label:'Ich verstehe die Phasen einer strukturierten Gruppensupervision.'},
    {key:'rolePerspective', category:'Inhaltliches Verständnis', label:'Ich kann die Perspektiven der verschiedenen Rollen besser einordnen.'},
    {key:'technicalClarity', category:'Technische Umsetzung und Bedienbarkeit', label:'Die technische Umsetzung der Anwendung war verständlich.'},
    {key:'usability', category:'Technische Umsetzung und Bedienbarkeit', label:'Die Anwendung war gut bedienbar.'},
    {key:'presentationDesign', category:'Allgemeine Gestaltung der Präsentation', label:'Die Gestaltung der Präsentation war übersichtlich und ansprechend.'},
    {key:'presentationUsefulness', category:'Allgemeine Gestaltung der Präsentation', label:'Die erstellte Präsentation eignet sich gut, um Ergebnisse im Plenum vorzustellen.'},
    {key:'creativeOptions', category:'Allgemeine Gestaltung der Präsentation', label:'Die Bearbeitungsmöglichkeiten der Präsentation waren hilfreich.'}
  ];

  var cards = [];
  var current = 0;
  var deck = document.getElementById('deck');
  var slideCounter = document.getElementById('slideCounter');
  var statusEl = document.getElementById('status');
  var fullscreenBtn = document.getElementById('fullscreenBtn');

  function appUrl(){ try{ if(typeof getAppsScriptUrl==='function') return getAppsScriptUrl(); }catch(_){} return (window.SUPERVISION_CONFIG&&window.SUPERVISION_CONFIG.APPS_SCRIPT_URL)||''; }
  function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function jsonp(url, params){ return new Promise(function(resolve,reject){ var cb='manoListCb_'+Date.now()+'_'+Math.floor(Math.random()*1e9); var qs=new URLSearchParams(params||{}); qs.set('callback',cb); qs.set('_',Date.now()); var s=document.createElement('script'); var done=false; window[cb]=function(data){ done=true; cleanup(); resolve(data); }; function cleanup(){ try{ delete window[cb]; }catch(_){} if(s&&s.parentNode)s.parentNode.removeChild(s);} s.onerror=function(){ if(!done){ cleanup(); reject(new Error('Manometer-Auswertung konnte nicht geladen werden.')); } }; s.src=url+(url.indexOf('?')>=0?'&':'?')+qs.toString(); document.body.appendChild(s); setTimeout(function(){ if(!done){ cleanup(); reject(new Error('Zeitüberschreitung beim Laden der Auswertung.')); } },12000); }); }
  function avg(vals){ if(!vals.length) return null; return vals.reduce(function(a,b){ return a+b; },0)/vals.length; }
  function median(vals){ if(!vals.length) return null; var a=vals.slice().sort(function(x,y){ return x-y; }); var m=Math.floor(a.length/2); return a.length%2 ? a[m] : (a[m-1]+a[m])/2; }
  function plural(n,sing,plur){ return n===1?sing:(plur||sing+'en'); }

  function renderIntro(entries){
    return '<article class="slide">'
      + '<div class="slide-inner">'
      + '<section class="intro-hero">'
      + '<span class="slide-label">Überblick</span>'
      + '<h2>Gemeinsame Manometer-Auswertung</h2>'
      + '<p>Die Rückmeldungen werden anonym, gerätebezogen nur einmal und unabhängig von der Gruppen-ID ausgewertet. Nutze diese Ansicht wie eine Präsentation: im Vollbild mit den Pfeiltasten oder mit den Navigationsbuttons unten.</p>'
      + '<div class="summary-grid">'
      + '<div class="summary-card"><strong>'+entries.length+'</strong><span>'+plural(entries.length,'anonyme Rückmeldung','anonyme Rückmeldungen')+'</span></div>'
      + '<div class="summary-card"><strong>'+QUESTIONS.length+'</strong><span>Skalenfragen als einzelne Auswertungskacheln</span></div>'
      + '<div class="summary-card"><strong>1–10</strong><span>Skala mit Median und Einzelverteilung</span></div>'
      + '</div>'
      + '</section>'
      + '</div></article>';
  }

  function renderScale(q, entries, idx){
    var vals=entries.map(function(e){ return Number(e.scores&&e.scores[q.key]); }).filter(function(n){ return !isNaN(n)&&n>=1&&n<=10; });
    var counts={}; for(var i=1;i<=10;i++) counts[i]=0; vals.forEach(function(v){ counts[v]=(counts[v]||0)+1; });
    var med=median(vals); var av=avg(vals);
    var improvements=entries.map(function(e){ return e.improvements&&e.improvements[q.key]; }).filter(function(t){ return String(t||'').trim(); });
    var cols=''; for(var d=1;d<=10;d++){
      cols += '<div class="column"><div class="count-badge">'+(counts[d]||0)+'</div><div class="stack">';
      for(var c=0;c<counts[d];c++) cols += '<span class="dot" title="'+d+'"></span>';
      cols += '</div><div class="tick">'+d+'</div></div>';
    }
    var marker = med ? '<div class="median-marker" style="left:calc('+((((med-1)/9)*100).toFixed(4))+'% - 1px)"></div>' : '';
    var comments = improvements.length ? improvements.map(function(t){ return '<div class="comment">'+escapeHtml(t)+'</div>'; }).join('') : '<p class="empty">Keine Verbesserungsvorschläge oder Kritik zu dieser Frage vorhanden.</p>';
    return '<article class="slide" data-card="scale">'
      + '<div class="slide-inner">'
      + '<div class="slide-head"><div><span class="slide-label">'+escapeHtml(q.category)+'</span><h2>'+escapeHtml(q.label)+'</h2></div><div class="slide-counter">Frage '+(idx+1)+' von '+QUESTIONS.length+'</div></div>'
      + '<div class="metric-row">'
      + '<div class="avg-box"><strong>'+(av===null?'–':av.toFixed(1))+'</strong><span class="sub">Durchschnitt von 10</span><span class="mini">'+vals.length+' Antworten · Median '+(med===null?'–':med)+'</span></div>'
      + '<div class="scale-viz">'
      + marker
      + '<div class="scale-head"><div class="scale-title">Einzelne Punktevergaben aller Geräte</div><div class="scale-sub">Jeder Punkt steht für eine anonyme Rückmeldung.</div></div>'
      + '<div class="distribution">'+cols+'</div>'
      + '</div></div>'
      + '<div class="comments"><h3>Gesammelte Kritik / Verbesserungsvorschläge</h3><div class="comment-list">'+comments+'</div></div>'
      + '</div></article>';
  }

  function renderTextCard(title, kicker, texts){
    var body = texts.length ? '<div class="text-card-list">'+texts.map(function(t){ return '<div class="text-entry">'+escapeHtml(t)+'</div>'; }).join('')+'</div>' : '<p class="empty">Keine Einträge vorhanden.</p>';
    return '<article class="slide"><div class="slide-inner"><div class="slide-head"><div><span class="slide-label">'+escapeHtml(kicker)+'</span><h2>'+escapeHtml(title)+'</h2></div><div class="slide-counter">Offene Antworten</div></div><div class="text-block"><h3>Gesammelte Aussagen</h3>'+body+'</div></div></article>';
  }

  function renderChoiceCard(title, kicker, entries, key){
    var yes = entries.filter(function(e){ return String(e[key]||'').toLowerCase()==='ja'; }).length;
    var no = entries.filter(function(e){ return String(e[key]||'').toLowerCase()==='nein'; }).length;
    var other = entries.length - yes - no;
    return '<article class="slide"><div class="slide-inner"><div class="slide-head"><div><span class="slide-label">'+escapeHtml(kicker)+'</span><h2>'+escapeHtml(title)+'</h2></div><div class="slide-counter">Ja / Nein</div></div><div class="choice-grid"><div class="choice-card"><strong>'+yes+'</strong><span>Ja</span></div><div class="choice-card"><strong>'+no+'</strong><span>Nein</span></div><div class="choice-card"><strong>'+other+'</strong><span>Keine Angabe</span></div></div></div></article>';
  }

  function render(data){
    var entries = (data && data.entries) || [];
    document.getElementById('responseCount').textContent = entries.length;
    var html = renderIntro(entries);
    QUESTIONS.forEach(function(q,i){ html += renderScale(q, entries, i); });
    html += renderTextCard('Allgemeines Lob, Kritik und Anregungen','Offene Antworten', entries.map(function(e){ return e.generalFeedback; }).filter(Boolean));
    html += renderChoiceCard('Wurde manchmal volle Punktzahl gewählt, um die Pflichtangabe bei der Kritik zu vermeiden?','Zusatzfrage', entries, 'avoidCriticism');
    html += renderChoiceCard('Wurde ChatGPT oder ein anderes LLM verwendet?','KI / LLM', entries, 'llmUsed');
    html += renderTextCard('Optionale Hinweise zur LLM-Nutzung','Zusatzangaben', entries.map(function(e){ return e.llmDetails; }).filter(Boolean));
    deck.innerHTML = html;
    cards = Array.prototype.slice.call(deck.querySelectorAll('.slide'));
    setActive(0);
    statusEl.textContent = 'Auswertung geladen.';
  }

  function updateProgress(){
    if(!cards.length) return;
    document.getElementById('progressBar').style.width = (((current+1)/cards.length)*100)+'%';
    slideCounter.textContent = 'Kachel '+(current+1)+' / '+cards.length;
  }

  function setActive(i){
    if(!cards.length) return;
    if(i<0) i=0;
    if(i>=cards.length) i=cards.length-1;
    current=i;
    cards.forEach(function(card, idx){
      card.classList.remove('active','prev','next');
      if(idx < current) card.classList.add('prev');
      else if(idx > current) card.classList.add('next');
      else card.classList.add('active');
    });
    document.getElementById('prevCard').disabled = current===0;
    document.getElementById('nextCard').disabled = current===cards.length-1;
    updateProgress();
  }

  function next(){ setActive(current+1); }
  function prev(){ setActive(current-1); }

  document.getElementById('prevCard').addEventListener('click', prev);
  document.getElementById('nextCard').addEventListener('click', next);

  document.addEventListener('keydown', function(ev){
    if(ev.key==='ArrowRight' || ev.key==='PageDown' || ev.key===' '){ ev.preventDefault(); next(); }
    if(ev.key==='ArrowLeft' || ev.key==='PageUp'){ ev.preventDefault(); prev(); }
    if((ev.key||'').toLowerCase()==='f'){ ev.preventDefault(); toggleFullscreen(); }
  });

  function updateFullscreenBtn(){
    fullscreenBtn.textContent = document.fullscreenElement ? 'Vollbild beenden' : 'Vollbild starten';
  }
  function toggleFullscreen(){
    if(!document.fullscreenElement){
      (document.documentElement.requestFullscreen ? document.documentElement.requestFullscreen() : Promise.reject()).catch(function(){});
    } else if(document.exitFullscreen){
      document.exitFullscreen();
    }
  }
  fullscreenBtn.addEventListener('click', toggleFullscreen);
  document.addEventListener('fullscreenchange', updateFullscreenBtn);

  document.addEventListener('DOMContentLoaded', async function(){
    var url = appUrl();
    if(!url){ statusEl.textContent='Keine Apps-Script-URL gefunden.'; return; }
    try{
      var data = await jsonp(url, {action:'manometerFeedbackList'});
      if(!data || data.ok===false) throw new Error((data&&data.error)||'Keine Daten erhalten.');
      render(data);
    }catch(err){
      statusEl.textContent='Auswertung konnte nicht geladen werden: '+(err&&err.message?err.message:err);
    }
  });
})();
</script>
</body>
</html>
