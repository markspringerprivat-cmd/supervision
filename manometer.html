<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manometer – Feedback</title>
  <link rel="stylesheet" href="css/styles.css?v=manometer-v13-recreate-delete">
  <style>
    :root{
      --bg1:#091528; --bg2:#122644; --bg3:#0e6a7d;
      --panel:#f9fbff; --panel-strong:#ffffff; --line:#d9e5f0;
      --text:#17263d; --muted:#63758b; --blue:#285c93;
      --shadow:0 22px 56px rgba(7,19,35,.16); --radius:30px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body[data-mode="manometer"]{
      margin:0; overflow:hidden; color:var(--text);
      background:
        radial-gradient(circle at 0% 50%, rgba(0,70,170,.25), transparent 17%),
        radial-gradient(circle at 100% 45%, rgba(0,195,200,.18), transparent 18%),
        linear-gradient(118deg,var(--bg1),var(--bg2) 58%, #0f1d36 100%);
      font-family: "Aptos", "Segoe UI Variable", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    body[data-mode="manometer"] header, body[data-mode="manometer"] footer{display:none!important}
    body[data-mode="manometer"] .local-reset-bar{
      position:fixed!important; inset:0 0 auto 0!important; z-index:70!important; margin:0!important;
      border-radius:0!important; box-shadow:0 10px 26px rgba(0,0,0,.14)!important;
    }
    .loading-screen{position:fixed; inset:0; z-index:90; display:flex; align-items:center; justify-content:center; background:linear-gradient(118deg,var(--bg1),var(--bg2) 58%, #0f1d36 100%); color:#fff; transition:opacity .35s ease, visibility .35s ease}
    .loading-screen.hidden{opacity:0; visibility:hidden}
    .loading-card{width:min(560px, calc(100% - 32px)); padding:30px 28px; border-radius:28px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); box-shadow:0 18px 48px rgba(0,0,0,.22); text-align:center}
    .loading-card h2{margin:0 0 8px; font-size:1.65rem; font-weight:800}
    .loading-card p{margin:0 0 16px; color:rgba(255,255,255,.82); font-weight:400}
    .loading-track{height:14px; border-radius:999px; background:rgba(255,255,255,.12); overflow:hidden; border:1px solid rgba(255,255,255,.12)}
    .loading-fill{height:100%; width:0; background:linear-gradient(90deg,#89bfff,#d7efff); transition:width .28s ease}
    .loading-status{margin-top:14px; color:rgba(255,255,255,.9); font-weight:700}

    .shell{height:100%; display:flex; flex-direction:column; padding:74px 18px 18px; gap:16px}
    .progress-wrap{width:min(1500px, calc(100vw - 36px)); margin:0 auto; height:10px; border-radius:999px; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.14); overflow:hidden}
    .progress-bar{height:100%; width:0; background:linear-gradient(90deg,#9bcbff,#f2fbff); transition:width .42s ease}
    .stage-wrap{position:relative; flex:1; min-height:0; display:flex; align-items:center; justify-content:center; width:min(1500px, calc(100vw - 36px)); margin:0 auto}
    .feedback-stage{position:relative; width:100%; height:min(82vh, 940px); min-height:680px; opacity:0; transition:opacity .32s ease}
    .feedback-stage.ready{opacity:1}
    .stage-arrow{position:absolute; top:50%; transform:translateY(-50%); z-index:20; width:58px; height:58px; border-radius:50%; border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.10); color:#fff; font-size:2rem; font-weight:700; cursor:pointer; display:grid; place-items:center; box-shadow:0 14px 34px rgba(0,0,0,.18); backdrop-filter:blur(12px); transition:transform .18s ease, background .18s ease, opacity .18s ease}
    .stage-arrow:hover{transform:translateY(-50%) scale(1.05); background:rgba(255,255,255,.14)}
    .stage-arrow:disabled{opacity:.35; cursor:not-allowed}
    .stage-arrow.left{left:-68px}.stage-arrow.right{right:-68px}

    .card{position:absolute; inset:0; background:rgba(250,252,255,.985); border-radius:34px; border:1px solid rgba(255,255,255,.74); box-shadow:var(--shadow); display:flex; flex-direction:column; overflow:hidden; opacity:0; pointer-events:none; transform:translate3d(84px,0,0) scale(.98); transition:transform .58s cubic-bezier(.18,.82,.22,1), opacity .42s ease; will-change:transform, opacity; contain:layout paint style}
    .card.active{opacity:1; transform:translate3d(0,0,0) scale(1); pointer-events:auto; z-index:3}
    .card.prev{opacity:0; transform:translate3d(-84px,0,0) scale(.98); z-index:1}
    .card.next{opacity:0; transform:translate3d(84px,0,0) scale(.98); z-index:1}
    .card.far{visibility:hidden}
    .card-inner{height:100%; padding:34px 34px 30px; display:flex; flex-direction:column; min-height:0}
    .card-head{display:flex; justify-content:space-between; gap:22px; align-items:flex-start; margin-bottom:22px; flex:0 0 auto}
    .kicker{display:inline-flex; align-items:center; padding:8px 14px; border-radius:999px; background:#eaf2fb; color:#26486f; font-size:.78rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase}
    .counter{color:#6b7f96; font-weight:650; font-size:1rem; white-space:nowrap}
    .card h2{margin:0 0 8px; font-size:clamp(1.45rem, 2.25vw, 2.45rem); line-height:1.14; font-weight:750; letter-spacing:-.02em}
    .card p{margin:0; color:var(--muted); line-height:1.55; font-size:1rem; font-weight:400}

    .intro-grid,.question-grid,.text-grid{display:grid; grid-template-columns:minmax(0,1.02fr) minmax(360px,.98fr); gap:26px; flex:1; min-height:0}
    .panel{background:linear-gradient(180deg,#fff,#f8fbff); border:1px solid var(--line); border-radius:26px; box-shadow:0 10px 24px rgba(15,23,42,.05); min-height:0}
    .panel.padded{padding:20px}.panel.scroll{overflow:auto}
    .intro-left{padding:26px; background:radial-gradient(circle at top left, rgba(127,180,234,.16), transparent 35%), linear-gradient(180deg,#fff,#f7fbff)}
    .intro-left h2{font-size:clamp(1.9rem,2.9vw,3rem); font-weight:760}
    .intro-points{display:grid; gap:12px; margin-top:18px}
    .intro-note{padding:16px 18px; border-radius:18px; background:#fff; border:1px solid var(--line)}
    .intro-note strong{display:block; margin-bottom:6px; color:#1a3a60; font-weight:700}

    .flow-steps{display:grid;gap:10px;margin-top:18px}
    .flow-card{padding:14px 16px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 18px rgba(15,23,42,.04)}
    .flow-card strong{display:block;margin-bottom:4px;color:#1a3a60;font-weight:650}
    .flow-arrow{text-align:center;color:#7b8fa7;font-size:1.15rem;line-height:1;font-weight:500}
    .start-action{display:flex;justify-content:flex-end;margin-top:18px}


    .question-left{display:grid; grid-template-rows:auto minmax(0,1fr); gap:18px; min-height:0}
    .metrics{display:grid; grid-template-columns:152px 1fr; gap:14px; min-height:0}
    .score-tile{border-radius:24px; padding:18px; color:#fff; display:flex; flex-direction:column; justify-content:center; background:linear-gradient(145deg,#ff3b30,#ff9f0a); box-shadow:0 14px 30px rgba(18,35,58,.12); transition:background .35s ease}
    .score-tile .value{font-size:3.05rem; line-height:1; font-weight:760}
    .score-tile .caption{font-size:1rem; font-weight:650; margin-top:8px}
    .mini-stack{display:grid; gap:10px}
    .mini-box{padding:14px 16px; border-radius:18px; background:#eef6ff; border:1px solid #d7e6f5; color:#234972; line-height:1.45; display:flex; align-items:center; font-weight:600}
    .slider-panel{padding:18px; display:flex; flex-direction:column; overflow:hidden}
    .slider-panel h3,.question-right h3{margin:0; color:#1b3f67; font-size:1.05rem; font-weight:720}
    .slider-box{flex:1; min-height:0; border-radius:24px; border:1px solid #dce7f2; background:radial-gradient(circle at top left, rgba(111,168,220,.13), transparent 36%), linear-gradient(180deg,#fbfdff,#f3f8fd); padding:18px 18px 14px; display:flex; flex-direction:column; justify-content:flex-start}
    .range-bg{position:relative; padding:24px 0 6px}
    .range-bg::before{content:''; position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); height:22px; border-radius:999px; background:linear-gradient(90deg,#ff3b30 0%,#ff9500 25%,#ffd60a 50%,#7fe238 74%,#10c44c 100%); opacity:.14}
    input[type=range]{appearance:none; -webkit-appearance:none; width:100%; height:22px; background:transparent; position:relative; z-index:2; cursor:pointer}
    input[type=range]::-webkit-slider-runnable-track{height:22px; border-radius:999px; background:var(--range-fill); border:1px solid #d7e2ee}
    input[type=range]::-moz-range-track{height:22px; border-radius:999px; background:var(--range-fill); border:1px solid #d7e2ee}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; appearance:none; width:34px; height:34px; margin-top:-7px; border-radius:50%; background:#295c92; border:4px solid #fff; box-shadow:0 6px 16px rgba(15,23,42,.18)}
    input[type=range]::-moz-range-thumb{width:28px; height:28px; border-radius:50%; background:#295c92; border:4px solid #fff; box-shadow:0 6px 16px rgba(15,23,42,.18)}
    .scale-warning{margin-top:14px; padding:10px 12px; border:1px solid #ffd8c2; background:#fff7f2; color:#9a3412; border-radius:16px; font-size:.92rem; font-weight:650}.scale-warning.hidden{display:none!important}.primary-btn:disabled,.stage-arrow:disabled,#nextBtn:disabled{opacity:.38!important;cursor:not-allowed!important;filter:grayscale(.2)}
    .range-ends{display:flex; justify-content:space-between; color:#5a7088; font-weight:600; font-size:.93rem; margin-top:12px}
    .tick-row{display:grid; grid-template-columns:repeat(10,minmax(0,1fr)); gap:7px; margin-top:14px}
    .tick-pill{height:30px; display:grid; place-items:center; border:1px solid #dbe6f2; border-radius:999px; background:#fff; color:#355270; font-weight:650; font-size:.85rem}

    .question-right{padding:18px; display:flex; flex-direction:column; min-height:0}
    .list-head{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px}
    .add-btn,.primary-btn,.secondary-btn{font-family:inherit; font-weight:700}
    .add-btn{border:0; border-radius:999px; padding:10px 14px; background:#2b62a0; color:#fff; cursor:pointer; box-shadow:0 8px 18px rgba(43,98,160,.16)}
    .req-note{padding:10px 12px; border:1px solid #ffd8c2; background:#fff7f2; border-radius:16px; color:#9a3412; font-size:.94rem; font-weight:400; margin:12px 0 0}
    .entry-list{display:grid; gap:12px; align-content:start; min-height:0; overflow:auto; padding-right:4px}
    .entry-row{display:grid; grid-template-columns:1fr auto; gap:8px; align-items:start}
    .entry-row textarea,.entry-row input,.llm-input{width:100%; font:inherit; color:var(--text); background:#fff; border:1px solid #ccd9e8; border-radius:16px; padding:12px 14px; resize:vertical}
    .entry-row textarea{min-height:74px}
    .entry-row textarea:focus,.entry-row input:focus,.llm-input:focus{outline:3px solid rgba(37,92,147,.12); border-color:#a0c1e4}
    .remove-entry{width:40px; height:40px; border-radius:14px; border:1px solid #dce6f0; background:#fff; color:#be4a1d; font-size:1.05rem; font-weight:700; cursor:pointer}

    .text-grid{grid-template-columns:1fr}
    .text-lists{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; flex:1; min-height:0}
    .list-column{display:flex; flex-direction:column; min-height:0}
    .list-column .panel{display:flex; flex-direction:column; min-height:0; padding:18px}
    .list-column .entry-list{flex:1}
    .list-column .entry-row textarea{min-height:66px}

    .yn-layout{display:flex; flex-direction:column; justify-content:center; align-items:center; gap:18px; flex:1; min-height:0}.yn-layout h2{max-width:980px;text-align:center;font-size:clamp(1.65rem,2.45vw,2.75rem);font-weight:760;margin:0 0 8px}
    .yn-question{max-width:920px; text-align:center; font-size:1.16rem}
    .yn-buttons{display:flex; align-items:center; justify-content:center; gap:30px; flex-wrap:wrap}
    .yn-card{width:250px; height:180px; border:none; border-radius:30px; cursor:pointer; color:#fff; font-size:2rem; font-weight:760; display:flex; align-items:center; justify-content:center; box-shadow:0 18px 34px rgba(15,23,42,.12); transition:transform .18s ease, filter .18s ease, box-shadow .18s ease}
    .yn-card:hover{transform:translateY(-2px)}
    .yn-card.yes{background:linear-gradient(145deg,#12d95d,#09b447)}
    .yn-card.no{background:linear-gradient(145deg,#ff6a00,#ff2d55)}
    .yn-card.selected{box-shadow:0 0 0 7px rgba(41,92,146,.20), 0 20px 38px rgba(15,23,42,.20);transform:translateY(-3px) scale(1.03);filter:saturate(1.12)}
    .yn-card input{display:none}
    .small-warn{width:min(760px,100%); padding:10px 12px; border:1px solid #ffd8c2; background:#fff7f2; color:#9a3412; border-radius:16px; font-size:.9rem; font-weight:650; text-align:center}
    .llm-box{width:min(520px,100%); display:grid; gap:10px}
    .llm-input{border-radius:999px; padding:12px 16px}

    .blocked-card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:100%;gap:18px}.blocked-card h2{font-size:clamp(1.8rem,3vw,3.4rem);font-weight:760;margin:0}.blocked-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.submit-state{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; height:100%; gap:16px; transition:opacity .28s ease, transform .28s ease}
    .submit-state.hidden{opacity:0; transform:translateY(18px); pointer-events:none; position:absolute; inset:34px}
    .submit-state h2{margin-bottom:2px}
    .primary-btn,.secondary-btn{border:none; border-radius:999px; padding:12px 18px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; font-size:1rem}
    .primary-btn{background:#295c92; color:#fff; box-shadow:0 10px 22px rgba(41,92,146,.18)}
    .secondary-btn{background:#eaf2fb; color:#1e4068}
    .separator{width:min(420px,100%); height:1px; background:linear-gradient(90deg,transparent,#c8d8e8,transparent); margin:4px 0}
    .inline-actions{display:flex; gap:12px; flex-wrap:wrap; justify-content:center}

    .game-box{width:min(1120px,100%); display:flex; flex-direction:column; gap:12px; text-align:left}
    .game-head{display:flex; justify-content:space-between; align-items:flex-start; gap:18px; flex-wrap:wrap}
    .game-head h3{margin:0; font-size:1.45rem; color:#18365a; font-weight:740}
    .game-head p{margin:6px 0 0}
    .game-stats{display:flex; gap:12px; flex-wrap:wrap}
    .chip{padding:10px 14px; border-radius:999px; background:#eef6ff; border:1px solid #d7e6f5; color:#234972; font-weight:700}
    .game-canvas-wrap{border:1px solid #dce7f2; border-radius:26px; overflow:hidden; background:linear-gradient(180deg,#fff,#f5f9ff); position:relative}
    #runnerCanvas{display:block; width:100%; height:auto}
    .game-footer{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:4px; flex-wrap:wrap}
    .game-msg{color:#5f738b; font-weight:600}.game-box button:disabled{opacity:.42;cursor:not-allowed;filter:grayscale(.35)}

    .nav-dock{width:min(1500px, calc(100vw - 36px)); margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); border-radius:24px; padding:14px 16px; color:#fff}
    .nav-side{display:flex; gap:12px; align-items:center; flex-wrap:wrap}.nav-info{text-align:center; font-weight:650; color:rgba(255,255,255,.88)}
    .nav-dock .secondary-btn,.nav-dock .primary-btn{padding:11px 17px}
    .status-row{width:min(1500px, calc(100vw - 36px)); margin:0 auto; display:grid; gap:10px}
    .status{padding:14px 16px; border-radius:16px; font-weight:650; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.12); color:#fff}
    .status.ok{background:#e9f8ef; color:#256142; border-color:#bde7cc}.status.error{background:#fff2f2; color:#8a1f1f; border-color:#efc5c5}
    .already-voted{padding:14px 16px; border-radius:16px; background:#e9f8ef; color:#256142; border:1px solid #bde7cc; font-weight:650}[hidden]{display:none!important}

    @media (max-width:1650px){.stage-arrow.left{left:-24px}.stage-arrow.right{right:-24px}}
    @media (max-width:1180px){.question-grid,.intro-grid,.text-grid{grid-template-columns:1fr}.feedback-stage{height:min(87vh,1060px); min-height:780px}.text-lists{grid-template-columns:1fr}.card-inner{overflow:auto}.stage-arrow.left{left:8px}.stage-arrow.right{right:8px}.question-left{grid-template-rows:auto auto}}
    @media (max-width:780px){.shell{padding-left:10px;padding-right:10px}.progress-wrap,.stage-wrap,.nav-dock,.status-row{width:100%}.card-inner{padding:22px 18px 18px}.metrics{grid-template-columns:1fr}.nav-dock{flex-direction:column;align-items:stretch}.nav-side{justify-content:center}.yn-card{width:190px;height:138px;font-size:1.7rem}.stage-arrow{width:48px;height:48px;font-size:1.6rem}}
  </style>
</head>
<body data-mode="manometer">
  <div id="loadingScreen" class="loading-screen">
    <div class="loading-card">
      <h2>Feedbackbogen wird geladen</h2>
      <p>Die Karten werden vorbereitet.</p>
      <div class="loading-track"><div id="loadingFill" class="loading-fill"></div></div>
      <div id="loadingStatus" class="loading-status">Ansicht wird aufgebaut …</div>
    </div>
  </div>
  <main class="shell">
    <div class="progress-wrap"><div id="progressBar" class="progress-bar"></div></div>
    <form id="manometerForm" class="stage-wrap">
      <button id="arrowPrev" type="button" class="stage-arrow left" aria-label="Vorherige Kachel">‹</button>
      <div id="feedbackStage" class="feedback-stage"></div>
      <button id="arrowNext" type="button" class="stage-arrow right" aria-label="Nächste Kachel">›</button>
    </form>
    <div class="status-row">
      <div id="statusBox" class="status" hidden></div>
      <div id="alreadyVotedBox" class="already-voted" hidden>Von diesem Gerät wurde bereits Feedback abgegeben. Falls die Administration die Hardware-IDs freigegeben hat, kannst du erneut abstimmen; andernfalls blockiert Apps Script die Mehrfachabgabe.</div>
    </div>
    <div id="navDock" class="nav-dock">
      <div class="nav-side"><button id="prevBtn" type="button" class="secondary-btn">← Zurück</button><button id="nextBtn" type="button" class="primary-btn">Weiter →</button></div>
      <div class="nav-info"><span id="stepCounter">Kachel 1 / 1</span></div>
      <div class="nav-side" style="justify-content:flex-end"></div>
    </div>
  </main>
  <script src="js/config.js?v=manometer-v13-recreate-delete"></script>
  <script src="js/app.js?v=manometer-v13-recreate-delete"></script>
  <script>
  (function(){
    const QUESTIONS = [
      {key:'presentationPressure', category:'Startfrage', label:'Die Aussicht auf eine zufällige Präsentation im Plenum hat dazu geführt, dass die Aufgaben gewissenhafter bearbeitet wurden.'},
      {key:'caseConsultation', category:'Inhaltliches Verständnis', label:'Ich kenne verschiedene Arten der Fallberatung.'},
      {key:'phaseUnderstanding', category:'Inhaltliches Verständnis', label:'Ich verstehe die Phasen einer strukturierten Gruppensupervision.'},
      {key:'rolePerspective', category:'Inhaltliches Verständnis', label:'Ich kann die Perspektiven der verschiedenen Rollen besser einordnen.'},
      {key:'technicalClarity', category:'Technische Umsetzung und Bedienbarkeit', label:'Die technische Umsetzung der Anwendung war verständlich.'},
      {key:'usability', category:'Technische Umsetzung und Bedienbarkeit', label:'Die Anwendung war gut bedienbar.'},
      {key:'presentationDesign', category:'Allgemeine Gestaltung der Präsentation', label:'Die Gestaltung der Präsentation war übersichtlich und ansprechend.'},
      {key:'presentationUsefulness', category:'Allgemeine Gestaltung der Präsentation', label:'Die erstellte Präsentation eignet sich gut, um Ergebnisse im Plenum vorzustellen.'},
      {key:'creativeOptions', category:'Allgemeine Gestaltung der Präsentation', label:'Die Bearbeitungsmöglichkeiten der Präsentation waren hilfreich.'}
    ];
    const votedKey = 'manometer_voted_global_v2';
    let steps = [], current = 0, booted = false, game = null;
    function escapeHtml(text){return String(text||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function setLoading(percent, text){document.getElementById('loadingFill').style.width=Math.max(0,Math.min(100,percent))+'%'; if(text)document.getElementById('loadingStatus').textContent=text}
    function setStatus(message, type){const box=document.getElementById('statusBox'); box.hidden=false; box.className='status'+(type?' '+type:''); box.textContent=message}
    function clearStatus(){document.getElementById('statusBox').hidden=true}
    function getGroupId(){try{if(typeof window.getGroupId==='function') return window.getGroupId()||''}catch(_){} return new URLSearchParams(location.search).get('g')||localStorage.getItem('sv_group_id')||''}
    function getGroupName(){try{if(typeof window.loadText==='function') return window.loadText('summary_group_name')||localStorage.getItem('sv_group_name')||getGroupId()||'Gruppe'}catch(_){} return localStorage.getItem('sv_group_name')||getGroupId()||'Gruppe'}
    function getAppsUrl(){try{if(typeof window.getAppsScriptUrl==='function') return window.getAppsScriptUrl()||''}catch(_){} return (window.SUPERVISION_CONFIG&&window.SUPERVISION_CONFIG.APPS_SCRIPT_URL)||''}
    function getDeviceId(){const key='manometer_device_id_v2'; try{const ex=localStorage.getItem(key); if(ex)return ex; const created='dev_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,10); localStorage.setItem(key, created); return created}catch(_){return 'dev_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,10)}}
    function scoreColor(value){const pct=Math.max(0,Math.min(1,(Number(value||1)-1)/9)); const hue=2+130*pct; const light=52-8*pct; return `hsl(${hue}, 92%, ${light}%)`}
    function rangeGradient(value){const v=Number(value||5); const pct=((v-1)/9)*100; const col=scoreColor(v); return `linear-gradient(90deg, ${col} 0%, ${col} ${pct}%, #e7eef6 ${pct}%, #e7eef6 100%)`}

    function bindDynamicEvents(){document.querySelectorAll('[data-add-entry]').forEach(btn=>btn.addEventListener('click',()=>addEntry(btn.dataset.addEntry,''))); document.querySelectorAll('[data-scale-key]').forEach(input=>{input.addEventListener('input',()=>updateScaleUI(input)); updateScaleUI(input)}); document.querySelectorAll('.yn-card input').forEach(input=>input.addEventListener('change',updateChoiceStates)); updateChoiceStates()}

    function setActive(index){current=Math.max(0,Math.min(index,steps.length-1)); steps.forEach((step,i)=>{step.classList.remove('active','prev','next','far'); if(i===current)step.classList.add('active'); else if(i===current-1)step.classList.add('prev'); else if(i===current+1)step.classList.add('next'); else step.classList.add('far')}); updateControls(); clearStatus()}

    function jsonp(url, params){return new Promise((resolve,reject)=>{const cb='manometerCb_'+Date.now()+'_'+Math.floor(Math.random()*1e9); const qs=new URLSearchParams(params||{}); qs.set('callback',cb); qs.set('_',Date.now()); const script=document.createElement('script'); let settled=false; window[cb]=function(data){settled=true; cleanup(); resolve(data)}; function cleanup(){try{delete window[cb]}catch(_){} if(script.parentNode)script.parentNode.removeChild(script)} script.onerror=function(){if(!settled){cleanup(); reject(new Error('Manometer-Feedback konnte nicht übertragen werden.'))}}; script.src=url+(url.includes('?')?'&':'?')+qs.toString(); document.body.appendChild(script); setTimeout(()=>{if(!settled){cleanup(); reject(new Error('Zeitüberschreitung beim Übertragen des Feedbacks.'))}},15000)})}
    async function saveFeedback(){const url=getAppsUrl(); if(!url){setStatus('Keine Apps-Script-URL gefunden. Feedback kann nicht gespeichert werden.','error'); return} const button=document.getElementById('submitBtn'); button.disabled=true; button.textContent='Feedback wird gespeichert …'; setStatus('Bitte warten. Dein Feedback wird übertragen …'); const payload={action:'manometerFeedbackSave', deviceId:getDeviceId(), groupId:getGroupId(), groupName:getGroupName(), scores:JSON.stringify(collectScores()), improvements:JSON.stringify(collectImprovements()), generalFeedback:'', generalPraise:JSON.stringify(listValues('praise')), generalCriticism:JSON.stringify(listValues('criticism')), generalSuggestions:JSON.stringify(listValues('suggestions')), avoidCriticism:(document.querySelector('input[name="avoidCriticism"]:checked')||{}).value||'', llmUsed:(document.querySelector('input[name="llmUsed"]:checked')||{}).value||'', llmDetails:document.getElementById('llmDetails').value.trim()}; try{const result=await jsonp(url,payload); if(!result||result.ok===false){ if(result&&result.duplicate){ throw new Error('Von diesem Gerät wurde bereits Feedback abgegeben. Bitte lass die Hardware-IDs im Adminbereich freigeben und lade die Seite danach neu.'); } throw new Error(result&&(result.error||result.message)||'Speichern fehlgeschlagen.'); } try{localStorage.setItem(votedKey,'1')}catch(_){} setStatus('Feedback erfolgreich gespeichert.','ok'); showSubmitSuccess()}catch(err){setStatus('Feedback konnte nicht übertragen werden: '+err.message,'error')}finally{button.disabled=false; button.textContent='Feedback absenden'}}

    function spawnObstacle(){var roll=Math.random(); if(roll<.18){game.obstacles.push({x:game.canvas.width+30,y:162,w:26,h:20,type:'paper'}); return} if(roll<.48){game.obstacles.push({x:game.canvas.width+30,y:game.ground-18,w:30,h:18,type:'book'}); return} var w=22+Math.random()*18,h=26+Math.random()*18; game.obstacles.push({x:game.canvas.width+30,y:game.ground-h,w:w,h:h,type:'cone'})}

    function updateGame(dt){const f=dt/16.6667; game.score+=0.10*dt; game.speed=Math.min(6.8, game.speed+0.00035*dt); game.spawnAt-=f; if(game.spawnAt<=0){spawnObstacle(); game.spawnAt=74+Math.random()*48-Math.min(10,game.speed)} if(game.invuln>0)game.invuln-=dt; game.vy+=game.gravity*f; game.y+=game.vy*f; if(game.y>158){game.y=158; game.vy=0} game.obstacles.forEach(o=>o.x-=game.speed*f); game.obstacles=game.obstacles.filter(o=>o.x+o.w>-30); game.clouds.forEach(c=>{c.x-=0.8*f; if(c.x+c.w<0){c.x=game.canvas.width+40+Math.random()*100; c.y=42+Math.random()*46; c.w=38+Math.random()*30}}); const player={x:game.x,y:game.y,w:game.width,h:game.height}; for(const obstacle of game.obstacles){if(intersects(player, obstacle)){loseLife(); break}} game.highscore=Math.max(game.highscore,Math.floor(game.score)); refreshGameHud()}

    function drawRunner(ctx){const x=game.x,y=game.y; ctx.save(); ctx.fillStyle='#f8c9a0'; ctx.beginPath(); ctx.arc(x+18,y+11,9,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#2f68b8'; ctx.fillRect(x+8,y+20,20,18); ctx.fillStyle='#5ac8fa'; ctx.fillRect(x+24,y+22,10,14); ctx.fillStyle='#0f2748'; ctx.fillRect(x+10,y+38,6,14); ctx.fillRect(x+20,y+38,6,14); ctx.fillRect(x+6,y+24,6,4); ctx.fillRect(x+28,y+24,6,4); ctx.fillStyle='#ffffff'; ctx.fillRect(x+14,y+6,3,3); ctx.restore()}
    function drawObstacle(ctx,o){ctx.save(); if(o.type==='paper'){ctx.fillStyle='#fffef5'; ctx.strokeStyle='#8fb3d9'; ctx.lineWidth=2; if(ctx.roundRect){ctx.beginPath(); ctx.roundRect(o.x,o.y,o.w,o.h,6); ctx.fill(); ctx.stroke()} else {ctx.fillRect(o.x,o.y,o.w,o.h); ctx.strokeRect(o.x,o.y,o.w,o.h)} ctx.strokeStyle='#9cc0e7'; for(let i=0;i<3;i++){ctx.beginPath(); ctx.moveTo(o.x+6,o.y+6+i*5); ctx.lineTo(o.x+o.w-6,o.y+6+i*5); ctx.stroke()}} else if(o.type==='book'){ctx.fillStyle='#ef7d32'; if(ctx.roundRect){ctx.beginPath(); ctx.roundRect(o.x,o.y,o.w,o.h,6); ctx.fill()} else {ctx.fillRect(o.x,o.y,o.w,o.h)} ctx.fillStyle='#ffd9b4'; ctx.fillRect(o.x+4,o.y+4,o.w-8,3); ctx.fillRect(o.x+4,o.y+9,o.w-10,2)} else {ctx.fillStyle='#f59e0b'; ctx.beginPath(); ctx.moveTo(o.x+o.w/2,o.y); ctx.lineTo(o.x+o.w,o.y+o.h); ctx.lineTo(o.x,o.y+o.h); ctx.closePath(); ctx.fill(); ctx.strokeStyle='#ffffff'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(o.x+o.w/2,o.y+4); ctx.lineTo(o.x+o.w/2,o.y+o.h-4); ctx.stroke()} ctx.restore()}
    function drawGame(){if(!game)return; const ctx=game.ctx,c=game.canvas; ctx.clearRect(0,0,c.width,c.height); const sky=ctx.createLinearGradient(0,0,0,c.height); sky.addColorStop(0,'#f8fbff'); sky.addColorStop(.62,'#eef5fb'); sky.addColorStop(1,'#eaf2f9'); ctx.fillStyle=sky; ctx.fillRect(0,0,c.width,c.height); ctx.fillStyle='#d7ebff'; ctx.fillRect(0,0,c.width,44); game.clouds.forEach(cloud=>drawCloud(ctx,cloud)); ctx.fillStyle='#cfe7c5'; ctx.fillRect(0,game.ground,c.width,c.height-game.ground); ctx.strokeStyle='#90a5b8'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,game.ground+4); ctx.lineTo(c.width,game.ground+4); ctx.stroke(); for(let x=0;x<c.width;x+=18){ctx.fillStyle='#a7b1bd'; ctx.fillRect(x+(((x/18)%2)?2:0),game.ground+7,5,2)} const blink=game.invuln>0&&Math.floor(game.invuln/100)%2===0; if(!blink) drawRunner(ctx); game.obstacles.forEach(o=>drawObstacle(ctx,o)); ctx.fillStyle='#34465d'; ctx.font='600 15px "Aptos","Segoe UI",sans-serif'; ctx.fillText('Leben: '+game.lives,18,24); ctx.fillText('Punkte: '+Math.floor(game.score),18,46); if(!game.running){ctx.fillStyle='rgba(255,255,255,.72)'; ctx.fillRect(0,0,c.width,c.height); ctx.fillStyle='#1c3658'; ctx.font='700 30px "Aptos","Segoe UI",sans-serif'; ctx.textAlign='center'; ctx.fillText('Supervisions-Sprint',c.width/2,90); ctx.font='500 18px "Aptos","Segoe UI",sans-serif'; ctx.fillText(game.message,c.width/2,126); ctx.fillText('Mit Farben und Symbolen etwas leichter und lockerer gestaltet.',c.width/2,154); ctx.textAlign='left'} document.getElementById('gameMessage').textContent=game.message}
    function boot(){if(booted)return; booted=true; setLoading(10,'Karten werden aufgebaut …'); buildMarkup(); setLoading(45,'Layout wird optimiert …'); requestAnimationFrame(()=>requestAnimationFrame(()=>{setActive(0); document.getElementById('feedbackStage').classList.add('ready'); setLoading(90,'Interaktionen werden aktiviert …'); setTimeout(()=>{setLoading(100,'Bereit'); setTimeout(()=>document.getElementById('loadingScreen').classList.add('hidden'),180)},120)}))}
    document.getElementById('prevBtn').addEventListener('click',goPrev); document.getElementById('nextBtn').addEventListener('click',goNext); document.getElementById('arrowPrev').addEventListener('click',goPrev); document.getElementById('arrowNext').addEventListener('click',goNext); document.getElementById('manometerForm').addEventListener('submit',(ev)=>{ev.preventDefault(); if(validateStep(steps[current])) saveFeedback()}); document.addEventListener('click',(ev)=>{if(ev.target&&ev.target.id==='startGameBtn'){ev.preventDefault();startGame();}if(ev.target&&ev.target.id==='restartGameBtn'&&!ev.target.disabled){ev.preventDefault();startGame();}}); document.addEventListener('keydown',(ev)=>{if(steps[current]?.dataset.step==='submit'&& !document.getElementById('submitGame').classList.contains('hidden')) return; if(ev.key==='ArrowRight'||ev.key==='PageDown'){ev.preventDefault(); goNext()} if(ev.key==='ArrowLeft'||ev.key==='PageUp'){ev.preventDefault(); goPrev()}}); if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
  })();
  </script>
