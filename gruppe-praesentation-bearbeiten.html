<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gruppenpräsentation bearbeiten</title>
  <link rel="stylesheet" href="css/styles.css?v=remove-role-personalizer-case-text-v129">
  <style>
    body{background:linear-gradient(135deg,#eef5fb,#f8fbff)}
    .group-edit-shell{width:min(980px,calc(100vw - 36px));margin:0 auto;padding:28px 0 44px;display:grid;gap:18px}
    .group-edit-card{background:#fff;border:1px solid #d9e5f2;border-radius:28px;padding:26px;box-shadow:0 18px 42px rgba(15,31,53,.08)}
    .group-edit-card h1,.group-edit-card h2{margin:0 0 10px;color:#10223a}
    .group-edit-card p{color:#607187;line-height:1.55}
    .button-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
    .status{padding:13px 15px;border-radius:16px;background:#eef6ff;border:1px solid #d6e6f7;color:#234972}
    .ok{background:#e9f8ef;border-color:#abe1bd;color:#16703a}
    .warning{background:#fff2f2;border-color:#efc5c5;color:#8a1f1f}
  </style>
</head>
<body data-mode="group-presentation-edit">
<header><div class="wrap topbar"><div><h1>Gruppenpräsentation bearbeiten</h1><p>Eigene Gruppenpräsentation ändern und erneut speichern</p></div></div></header>
<main class="group-edit-shell">
  <section class="group-edit-card">
    <h2>Gruppenpräsentation wird geöffnet …</h2>
    <p>Der Bearbeitungsmodus startet automatisch. Oben im Editor gibt es die Buttons <strong>Speichern</strong> und <strong>Verwerfen</strong>.</p>
    <div class="button-row">
      <a id="backToProgressBtn" class="button secondary" href="gruppe-fortschritt.html">Zurück zum Gruppenfortschritt</a>
    </div>
  </section>
  <div id="groupPresentationEditStatus" class="status">Präsentationsdaten werden geladen …</div>
</main>
<script src="js/config.js?v=remove-role-personalizer-case-text-v129"></script>
<script src="js/app.js?v=remove-role-personalizer-case-text-v129"></script>
<script src="js/editor_v6_patch.js?v=remove-role-personalizer-case-text-v129"></script>
<script src="js/group_presentation_edit_v50.js?v=remove-role-personalizer-case-text-v129"></script>
</body>
</html>
